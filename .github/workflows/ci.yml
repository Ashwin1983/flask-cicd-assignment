name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # JOB 1: TEST
  # ============================================================
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v


  # ============================================================
  # JOB 2: BUILD AND PUSH
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # AWS Authentication using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Define image variables
      # --------------------------------------------------------
      - name: Set Docker image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG" \
            .

      # --------------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"

      # --------------------------------------------------------
      # Display image information
      # --------------------------------------------------------
      - name: Display image information
        run: |
          echo "Docker image successfully pushed:"
          echo "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"