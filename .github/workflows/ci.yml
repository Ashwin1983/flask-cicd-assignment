name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # JOB 1: TEST
  # ============================================================
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v


  # ============================================================
  # JOB 2: BUILD AND PUSH
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # AWS Authentication using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Define image variables
      # --------------------------------------------------------
      - name: Set Docker image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG" \
            .

      # --------------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"

      # --------------------------------------------------------
      # Display image information
      # --------------------------------------------------------
      - name: Display image information
        run: |
          echo "Docker image successfully pushed:"
          echo "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"
          
  # ============================================================
  # JOB 3: DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy container to EC2
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Deploying image:"
          echo "$IMAGE_URI"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask application ${IMAGE_TAG}" \
            --parameters "commands=[
              \"set -e\",
              \"echo 'Starting deployment...'\",
              \"echo 'Logging into ECR...'\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"echo 'Pulling image...'\",
              \"docker pull ${IMAGE_URI}\",
              \"echo 'Stopping existing container...'\",
              \"docker stop flask-cicd-app || true\",
              \"echo 'Removing existing container...'\",
              \"docker rm flask-cicd-app || true\",
              \"echo 'Starting new container...'\",
              \"docker run -d --name flask-cicd-app -p 5000:5000 ${IMAGE_URI}\",
              \"echo 'Waiting for application startup...'\",
              \"sleep 5\",
              \"echo 'Running health check...'\",
              \"curl --fail --silent --show-error http://localhost:5000/health\",
              \"echo 'Health check passed.'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment command to complete..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|ExecutionTimedOut|DeliveryTimedOut)
                echo "Deployment failed."
                echo "Deployment output:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac

          done

          echo "Deployment timed out waiting for SSM."
          exit 1